    title: "Cyber Essentials"
    text: |
      Protect your business. Prove your security.

      Why Cyber Essentials?
      - Protect your organisation against common cyber threats
      - Achieve a government-backed certification
      - Demonstrate that you have the essential technical controls in place
      - Meet certification requirements for contracts and supply chains
      - Build confidence with customers, partners and stakeholders
      - A practical and affordable approach to improving your cyber security

  - image: "images/IT_consultancy.jpg" # image from https://www.istockphoto.com/photo/it-consultancy-gm1181870910-331646905 or mayber https://www.openaccessgovernment.org/practical-cyber-security-risk-awareness-strategy/162241/
    
    title: "IASME Cyber Assurance"
    text: |
      Go beyond the basics. Build lasting resilience.

      Why IASME Cyber Assurance?
      - A UK-based practical alternative to ISO 27001, particularly suited to SME organisations
      - Identify and manage information security risks
      - Strengthen organisational resilience by embedding governance, risk management and incident response practices.
      - Demonstrate robust security practices to customers and stakeholders
      - Progress from foundational security towards a more comprehensive security framework
      - A more affordable route to the kind of assurance a standard like ISO 27001 provides.

  - image: "images/consultancy.jpg" # image from https://www.picpedia.org/chalkboard/c/consulting-services.html
    
    title: "Consultancy"
    text: |
      Expert advice. Practical solutions. Stronger security.
      
      How we can help:
      - Identify, understand and reduce cyber security risks
      - Prepare for Cyber Essentials and IASME Cyber Assurance
      - Understand and implement security requirements
      - Improve your existing cyber security controls
      - Get practical, expert guidance tailored to your organisation
  
