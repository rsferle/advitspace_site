theme: "github.com/writeonlycode/hugo-up-business"
locale: "en-us"

build:
  buildStats:
    enable: true

  cachebusters:
    - source: "assets/notwatching/hugo_stats\\.json"
      target: "css"

    - source: "(postcss|tailwind)\\.config\\.js"
      target: 'css'

module:
  hugo_version:
    min: "0.147.8"

  imports:
    - path: github.com/writeonlycode/hugo-up-business

  mounts:
    - source: 'hugo_stats.json'
      target: 'assets/notwatching/hugo_stats.json'
      disableWatch: true

    - source: 'assets'
      target: 'assets'

taxonomies:
  series: "series"
  tags: "tags"

security:
  exec:
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^npx$
      - ^node$
      - ^babel$
      - ^tailwindcss$
  funcs:
    getenv:
      - ^HUGO_
      - ^CI$
  http:
    urls:
      - (?i)^https?://[a-z0-9]
      - ! (?i)^https?://\d+\.
      - ! (?i)localhost
      - ! (?i)^https?://[^/?#]*@
caches:
  images:
    dir: :cacheDir/images